[project]
name = "zotero-gdrive-setup"
version = "0.2.0"
description = "Zotero × Google Drive integration setup: GUI guide + CLI tools for migrating attachments to cloud storage and unified file naming"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "FallseF"},
]
keywords = ["zotero", "google-drive", "research-tools", "zotmoov", "academic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FallseF/zotero-gdrive-setup"
Issues = "https://github.com/FallseF/zotero-gdrive-setup/issues"
Changelog = "https://github.com/FallseF/zotero-gdrive-setup/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 長い文字列リテラルは許容
